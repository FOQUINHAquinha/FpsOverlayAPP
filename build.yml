name: Build FPS Overlay

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Baixar PresentMon (console x64)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force pm | Out-Null
          $tags = gh release list --repo GameTechDev/PresentMon --limit 15 --json tagName -q '.[].tagName'
          foreach ($t in $tags) {
            gh release download $t --repo GameTechDev/PresentMon --pattern "PresentMon-*-x64.exe" --dir pm --clobber 2>$null
            if (Get-ChildItem pm\PresentMon-*-x64.exe -ErrorAction SilentlyContinue) { Write-Host "PresentMon: $t"; break }
          }
          $exe = Get-ChildItem pm\PresentMon-*-x64.exe | Select-Object -First 1
          if (-not $exe) { throw "Nao encontrei o PresentMon console nas releases" }
          Copy-Item $exe.FullName PresentMon.exe

      - name: Compilar
        run: dotnet publish FpsOverlay.csproj -c Release -o publish

      - name: Enviar o .exe (aba Actions > Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: FPSOverlay
          path: publish/FPSOverlay.exe

      - name: Publicar release (quando criar uma tag v1.0, v1.1...)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: publish/FPSOverlay.exe
